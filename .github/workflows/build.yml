name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android/iOS folders + apply settings
        run: bash tool/setup_platforms.sh

      - name: Install packages
        run: flutter pub get

      # Failures are also echoed as a single annotation so they can be read
      # without downloading logs (handy for AI agents with read-only API access).
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter analyze::$(grep -E 'error •' analyze.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $code

      - name: Unit & widget tests
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter test::$(grep -v '^\s*$' test.txt | tail -80 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $code

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release \
            --build-name=0.3.${{ github.run_number }} \
            --build-number=${{ github.run_number }} > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter build::$(grep -v '^\s*$' build.txt | tail -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $code
          fi
          cp build/app/outputs/flutter-apk/app-release.apk rodru.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodru-apk-${{ github.run_number }}
          path: rodru.apk

      - name: Publish release (download link for phones)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RODRU รอดรู้ ทดลอง build ${{ github.run_number }}
          make_latest: true
          prerelease: false
          files: rodru.apk
          body: |
            **ดาวน์โหลด `rodru.apk` ด้านล่าง แล้วเปิดบนมือถือ Android เพื่อติดตั้ง**
            (ต้องอนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ให้เบราว์เซอร์ที่ใช้ดาวน์โหลด)

            commit: ${{ github.sha }}

            ⚠️ ต้นแบบทดลอง — ไม่ใช่ระบบเตือนภัยทางการ
