name: Build APK

on:
  push:
    branches: [main]
    # Data files are read by the app at runtime; docs don't affect the build.
    paths-ignore:
      - "data/**"
      - "**.md"
      - "tool/update_radiation.py"
      - ".github/workflows/radiation.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android/iOS folders + apply settings
        run: bash tool/setup_platforms.sh

      - name: Install packages
        run: flutter pub get

      # Failures are also echoed as a single annotation so they can be read
      # without downloading logs (handy for AI agents with read-only API access).
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter analyze::$(grep -E 'error •' analyze.txt | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $code

      - name: Unit & widget tests
        run: |
          set +e
          flutter test > test.txt 2>&1
          code=$?
          cat test.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter test::$(grep -v '^\s*$' test.txt | tail -80 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit $code

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release \
            --build-name=0.4.${{ github.run_number }} \
            --build-number=${{ github.run_number }} > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter build::$(grep -v '^\s*$' build.txt | tail -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $code
          fi
          cp build/app/outputs/flutter-apk/app-release.apk rodru.apk

      # Every build must be signed with tool/signing/debug.keystore, otherwise
      # phones refuse to install the update over the previous version.
      - name: Verify signing key
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs rodru.apk | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "APK cert SHA-256: $CERT"
          if [ "$CERT" != "e438ec0829c7eb7f1ba4c214e37bbb1de0b6db636a32abe088f27d9ce90c8b81" ]; then
            echo "::error title=signing::APK signed with unexpected key $CERT"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodru-apk-${{ github.run_number }}
          path: rodru.apk

      - name: Publish release (download link for phones)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RODRU รอดรู้ ทดลอง build ${{ github.run_number }}
          make_latest: true
          prerelease: false
          files: rodru.apk
          body: |
            **ดาวน์โหลด `rodru.apk` ด้านล่าง แล้วเปิดบนมือถือ Android เพื่อติดตั้ง**
            (ต้องอนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ให้เบราว์เซอร์ที่ใช้ดาวน์โหลด)

            commit: ${{ github.sha }}

            ⚠️ ต้นแบบทดลอง — ไม่ใช่ระบบเตือนภัยทางการ

  # Web version for iPhone (Safari → "Add to Home Screen").
  # Published to https://<owner>.github.io/rodru/ via the gh-pages branch.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders + apply settings
        run: bash tool/setup_platforms.sh

      - name: Build web
        run: |
          flutter pub get
          set +e
          flutter build web --release --base-href /${{ github.event.repository.name }}/ > web.txt 2>&1
          code=$?
          cat web.txt
          if [ $code -ne 0 ]; then
            echo "::error title=flutter build web::$(grep -v '^\s*$' web.txt | tail -60 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit $code
          fi

      - name: Publish to GitHub Pages (gh-pages branch)
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
          commit_message: "Deploy web build ${{ github.run_number }}"
