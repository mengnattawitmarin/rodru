name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android/iOS folders + apply settings
        run: bash tool/setup_platforms.sh

      - name: Install packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit & widget tests
        run: flutter test

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name=0.2.${{ github.run_number }} \
            --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk rodru.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rodru-apk-${{ github.run_number }}
          path: rodru.apk

      - name: Publish release (download link for phones)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RODRU รอดรู้ ทดลอง build ${{ github.run_number }}
          make_latest: true
          prerelease: false
          files: rodru.apk
          body: |
            **ดาวน์โหลด `rodru.apk` ด้านล่าง แล้วเปิดบนมือถือ Android เพื่อติดตั้ง**
            (ต้องอนุญาต "ติดตั้งแอปจากแหล่งที่ไม่รู้จัก" ให้เบราว์เซอร์ที่ใช้ดาวน์โหลด)

            commit: ${{ github.sha }}

            ⚠️ ต้นแบบทดลอง — ไม่ใช่ระบบเตือนภัยทางการ
